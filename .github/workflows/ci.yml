name: ci
on:
  push: { branches: [main] }
  pull_request: {}
  schedule: [{ cron: '17 9 * * *' }]
  workflow_dispatch: {}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      # The sdk-contract tests prove the surface this package is loaded by; without pi installed they skip
      # silently, which is how the integration was only ever proven by hand at publish time (audit 2026-11-11).
      - run: npm install -g @earendil-works/pi-coding-agent
      - run: npx tsc --noEmit
      - run: npx vitest run
  # About 17 minutes: nightly and on demand, so the private repo's Actions minutes last the month.
  formal:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-formal
